name: Verify published release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published stable v0.8 tag to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Validate stable release tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v0\.8\.[0-9]+$ ]] || { echo "::error::Expected a stable v0.8 tag"; exit 1; }
          test "$(gh release view "$RELEASE_TAG" --json isDraft,isPrerelease --jq '[.isDraft,.isPrerelease] | any')" = "false"

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install verifier dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Download and verify the exact published artifact set
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          ARTIFACT_DIR="$RUNNER_TEMP/goodmemory-published-release"
          mkdir "$ARTIFACT_DIR"
          gh release download "$RELEASE_TAG" --dir "$ARTIFACT_DIR" \
            --pattern "release-manifest.json" \
            --pattern "goodmemory-$VERSION.tgz" \
            --pattern "goodmemory-$VERSION-release-evidence.json.gz" \
            --pattern "goodmemory-kimi-plugin-$VERSION.zip"
          VERIFIED="$(bun scripts/release/verify.ts --artifact-dir "$ARTIFACT_DIR")"
          INTEGRITY="$(VERIFIED="$VERIFIED" bun -e 'console.log(JSON.parse(process.env.VERIFIED).integrity)')"
          test "$(npm view "goodmemory@$VERSION" version)" = "$VERSION"
          test "$(npm view "goodmemory@$VERSION" dist.integrity)" = "$INTEGRITY"
          test "$(npm view "goodmemory@latest" version)" = "$VERSION"
          echo "Verified published source, all four assets, npm integrity and latest tag for $RELEASE_TAG." >> "$GITHUB_STEP_SUMMARY"
